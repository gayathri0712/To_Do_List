<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>

        <h1>
            <i class="fa-solid fa-list-check"></i>
            TaskFlow Pro
        </h1>

        <button id="themeBtn">
            <i class="fa-solid fa-moon"></i>
        </button>

    </header>

    <!-- Add Task -->

    <div class="task-box">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter a new task">

        <select id="priority">
            <option value="High">🔴 High</option>
            <option value="Medium">🟠 Medium</option>
            <option value="Low">🟢 Low</option>
        </select>

        <input
            type="date"
            id="dueDate">

        <button id="addBtn">
            <i class="fa-solid fa-plus"></i>
            Add
        </button>

    </div>

    <!-- Search -->

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="Search tasks...">

    </div>

    <!-- Statistics -->

    <div class="stats">

        <div class="card">
            <h2 id="totalTasks">0</h2>
            <p>Total Tasks</p>
        </div>

        <div class="card">
            <h2 id="completedTasks">0</h2>
            <p>Completed</p>
        </div>

        <div class="card">
            <h2 id="pendingTasks">0</h2>
            <p>Pending</p>
        </div>

    </div>

    <!-- Progress -->

    <div class="progress-container">

        <div class="progress-bar">

            <div id="progress"></div>

        </div>

        <p id="progressText">
            0% Completed
        </p>

    </div>

    <!-- Filters -->

    <div class="filters">

        <button
            class="filter active"
            data-filter="all">
            All
        </button>

        <button
            class="filter"
            data-filter="completed">
            Completed
        </button>

        <button
            class="filter"
            data-filter="pending">
            Pending
        </button>

        <button id="clearAll">
            Clear All
        </button>

    </div>

    <!-- Task List -->

    <ul id="taskList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
